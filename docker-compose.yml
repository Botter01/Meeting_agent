version: "3.9"

services:

  backend:
    build:
      context: ./backend
    container_name: meeting-backend
    ports:
      - "8000:8000"
    env_file:
      - .env              
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
    container_name: meeting-frontend
    ports:
      - "8501:8501"
    environment:
      - BACKEND_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
